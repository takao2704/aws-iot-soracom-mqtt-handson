<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
  <style>.title{font-family:'LINE Seed JP_TTF';font-size:38px;font-weight:700;fill:#0f172a}.sub{font-family:'LINE Seed JP_TTF';font-size:22px;font-weight:400;fill:#475569}.label{font-family:'LINE Seed JP_TTF';font-size:28px;font-weight:700;fill:#0f172a}.small{font-family:'LINE Seed JP_TTF';font-size:21px;font-weight:400;fill:#334155}.box{fill:#fff;stroke:#2563eb;stroke-width:4;rx:24}.net{fill:#eff6ff;stroke:#0284c7;stroke-width:4;rx:24}.aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:4;rx:24}.cert{fill:#fef3c7;stroke:#d97706;stroke-width:3;rx:14}.line{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="640" fill="#ffffff"/><text x="80" y="70" class="title">データ経路A：AWS IoT Coreへ直結</text><text x="80" y="108" class="sub">Raspberry PiがX.509証明書と秘密鍵を保持</text>
  <rect x="90" y="190" width="330" height="280" class="box"/><text x="255" y="260" text-anchor="middle" class="label">Raspberry Pi</text><text x="255" y="305" text-anchor="middle" class="small">mosquitto_pub / sub</text>
  <rect x="145" y="340" width="220" height="80" class="cert"/><text x="255" y="374" text-anchor="middle" class="small">証明書＋秘密鍵</text><text x="255" y="404" text-anchor="middle" class="small">Piに保存</text>
  <rect x="590" y="220" width="360" height="220" class="net"/><text x="770" y="295" text-anchor="middle" class="label">LTEルーター</text><text x="770" y="340" text-anchor="middle" class="small">SORACOM Air</text><text x="770" y="380" text-anchor="middle" class="small">インターネット接続</text>
  <rect x="1120" y="190" width="390" height="280" class="aws"/><text x="1315" y="280" text-anchor="middle" class="label">AWS IoT Core</text><text x="1315" y="330" text-anchor="middle" class="small">ATSデータエンドポイント</text><text x="1315" y="375" text-anchor="middle" class="small">X.509クライアント認証</text>
  <path d="M420 330 H590" class="line"/><path d="M950 330 H1120" class="line"/><text x="1035" y="300" text-anchor="middle" class="small">MQTTS :8883</text>
  <rect x="90" y="520" width="1420" height="70" rx="18" fill="#f1f5f9"/><text x="800" y="564" text-anchor="middle" class="small">TLS接続は Raspberry Pi → AWS IoT Core の1本。証明書の保護・更新・削除はデバイス側の責任です。</text>
</svg>
