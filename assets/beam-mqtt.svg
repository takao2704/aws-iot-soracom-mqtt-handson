<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
  <style>.title{font-family:'LINE Seed JP_TTF';font-size:38px;font-weight:700;fill:#0f172a}.sub{font-family:'LINE Seed JP_TTF';font-size:22px;font-weight:400;fill:#475569}.label{font-family:'LINE Seed JP_TTF';font-size:28px;font-weight:700;fill:#0f172a}.small{font-family:'LINE Seed JP_TTF';font-size:21px;font-weight:400;fill:#334155}.box{fill:#fff;stroke:#2563eb;stroke-width:4;rx:24}.carrier{fill:#eff6ff;stroke:#0284c7;stroke-width:4;rx:24}.beam{fill:#ecfeff;stroke:#0891b2;stroke-width:4;rx:24}.aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:4;rx:24}.cert{fill:#fef3c7;stroke:#d97706;stroke-width:3;rx:14}.line{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="640" fill="#ffffff"/><text x="80" y="70" class="title">データ経路B：SORACOM Beam経由</text><text x="80" y="108" class="sub">PiにはAWS IoT証明書を置かず、BeamがMQTTS接続を終端</text>
  <rect x="70" y="190" width="300" height="260" class="box"/><text x="220" y="270" text-anchor="middle" class="label">Raspberry Pi</text><text x="220" y="320" text-anchor="middle" class="small">証明書なし</text><text x="220" y="365" text-anchor="middle" class="small">beam.soracom.io</text>
  <rect x="510" y="190" width="360" height="260" class="beam"/><text x="690" y="255" text-anchor="middle" class="label">SORACOM Beam</text><text x="690" y="300" text-anchor="middle" class="small">MQTTエントリポイント</text>
  <rect x="580" y="345" width="220" height="70" class="cert"/><text x="690" y="375" text-anchor="middle" class="small">証明書＋秘密鍵</text><text x="690" y="403" text-anchor="middle" class="small">SORACOMに保存</text>
  <rect x="1080" y="190" width="430" height="260" class="aws"/><text x="1295" y="280" text-anchor="middle" class="label">AWS IoT Core</text><text x="1295" y="330" text-anchor="middle" class="small">ATSデータエンドポイント</text><text x="1295" y="375" text-anchor="middle" class="small">X.509クライアント認証</text>
  <path d="M370 320 H510" class="line"/><path d="M870 320 H1080" class="line"/><text x="440" y="285" text-anchor="middle" class="small">MQTT :1883</text><text x="975" y="285" text-anchor="middle" class="small">MQTTS :8883</text>
  <rect x="70" y="520" width="1440" height="70" rx="18" fill="#f1f5f9"/><text x="790" y="564" text-anchor="middle" class="small">Pi→BeamとBeam→AWSは別接続。端末からAWSまで一続きのMQTTSではありません。</text>
</svg>
