<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <style>
      .title{font-family:'LINE Seed JP_TTF';font-size:38px;font-weight:700;fill:#0f172a}.sub{font-family:'LINE Seed JP_TTF';font-size:22px;font-weight:400;fill:#475569}
      .label{font-family:'LINE Seed JP_TTF';font-size:28px;font-weight:700;fill:#0f172a}.small{font-family:'LINE Seed JP_TTF';font-size:21px;font-weight:400;fill:#334155}
      .box{fill:#fff;stroke:#2563eb;stroke-width:4;rx:24}.carrier{fill:#eff6ff;stroke:#0284c7;stroke-width:4;rx:24}
      .edge{fill:#f8fafc;stroke:#64748b;stroke-width:4;rx:24}.line{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="640" fill="#ffffff"/>
  <text x="80" y="70" class="title">管理経路：Napter 経由 SSH</text>
  <text x="80" y="108" class="sub">MQTTデータではなく、Raspberry Piを操作するための経路</text>
  <rect x="80" y="220" width="280" height="170" class="box"/>
  <text x="220" y="285" text-anchor="middle" class="label">操作PC</text><text x="220" y="330" text-anchor="middle" class="small">SSHクライアント</text>
  <rect x="500" y="180" width="300" height="250" class="carrier"/>
  <text x="650" y="265" text-anchor="middle" class="label">SORACOM</text><text x="650" y="315" text-anchor="middle" class="label">Napter</text><text x="650" y="360" text-anchor="middle" class="small">一時ホスト名＋ポート</text>
  <rect x="940" y="180" width="260" height="250" class="edge"/>
  <text x="1070" y="270" text-anchor="middle" class="label">UD-LT2</text><text x="1070" y="320" text-anchor="middle" class="small">DNAT</text><text x="1070" y="360" text-anchor="middle" class="small">50022 → Pi:22</text>
  <rect x="1320" y="220" width="220" height="170" class="box"/>
  <text x="1430" y="285" text-anchor="middle" class="label">Raspberry Pi</text><text x="1430" y="330" text-anchor="middle" class="small">SSH :22</text>
  <path d="M360 305 H500" class="line"/><path d="M800 305 H940" class="line"/><path d="M1200 305 H1320" class="line"/>
  <text x="430" y="280" text-anchor="middle" class="small">SSH</text><text x="870" y="280" text-anchor="middle" class="small">SORACOM Air</text><text x="1260" y="280" text-anchor="middle" class="small">LAN</text>
  <rect x="80" y="500" width="1460" height="80" rx="18" fill="#f1f5f9"/>
  <text x="810" y="550" text-anchor="middle" class="small">暗号化は操作PCとRaspberry PiのSSH両端で実施。Napterはオンデマンドの到達経路を提供します。</text>
</svg>
