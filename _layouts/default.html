<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">本文へ移動</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="ハンズオンの先頭へ">
          <span class="brand-mark" aria-hidden="true">MQ</span>
          <span class="brand-text">MQTT Workshop</span>
        </a>
        <nav class="header-nav" aria-label="主要ナビゲーション">
          <a href="{{ '/#section-0' | relative_url }}">構成</a>
          <a href="{{ '/#section-2' | relative_url }}">Napter</a>
          <a href="{{ '/#section-3' | relative_url }}">AWS IoT直結</a>
          <a href="{{ '/#section-5' | relative_url }}">Beam</a>
          <a href="{{ '/#section-6' | relative_url }}">比較</a>
        </nav>
        <div class="header-actions">
          <a class="button button-secondary" href="{{ site.github_url }}">GitHubで見る</a>
          <a class="button button-primary" href="{{ '/#section-1' | relative_url }}">ハンズオンを始める</a>
        </div>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="sidebar">目次</button>
      </div>
    </header>

    <div class="page-shell">
      <aside class="sidebar" id="sidebar" aria-label="ハンズオン目次">
        <div class="sidebar-inner">
          <p class="sidebar-title">ハンズオン手順</p>
          <nav class="toc">
            <a href="#overview">概要</a>
            <a href="#section-0"><span>0</span>構成を確認する</a>
            <a href="#section-1"><span>1</span>準備</a>
            <a href="#section-2"><span>2</span>Napter経由SSH</a>
            <a href="#section-3"><span>3</span>AWS IoT Core直結</a>
            <a href="#section-4"><span>4</span>証明書削除</a>
            <a href="#section-5"><span>5</span>SORACOM Beam</a>
            <a href="#section-6"><span>6</span>方式比較</a>
            <a href="#section-7"><span>7</span>トラブル対応・片付け</a>
            <a href="#appendix-a">講師付録A</a>
            <a href="#appendix-b">講師付録B</a>
            <a href="#references">参考資料</a>
          </nav>
          <div class="sidebar-downloads">
            <a href="{{ '/downloads/handson.pdf' | relative_url }}">PDFをダウンロード</a>
            <a href="{{ site.google_doc_url }}">Google Docs版</a>
          </div>
        </div>
      </aside>

      <main class="content" id="main-content">
        <div class="hero-actions" aria-label="教材リンク">
          <a class="button button-primary" href="#section-1">ハンズオンを始める</a>
          <a class="button button-secondary" href="{{ '/downloads/handson.pdf' | relative_url }}">PDFをダウンロード</a>
        </div>
        {{ content }}
      </main>
    </div>

    <footer class="site-footer">
      <p>実際の料金・サービス仕様は、開催時点のAWSおよびSORACOM公式情報を確認してください。</p>
      <a href="#top">ページ先頭へ戻る</a>
    </footer>
  </body>
</html>
